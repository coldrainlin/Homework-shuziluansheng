<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Three.js GLTF模型展示 - 作业二 (现代版)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
        }
        .model-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            color: white;
            z-index: 100;
        }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
            margin-left: 10px;
        }
        .stats {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">正在加载模型...</div>
    <div id="info">
        <h3>Three.js GLTF模型展示</h3>
        <p><strong>作业二功能：</strong></p>
        <p>✓ 加载GLTF模型</p>
        <p>✓ OrbitControls鼠标控制</p>
        <p>✓ 模型切换</p>
        <p>✓ 动画支持</p>
        <p><strong>操作说明：</strong></p>
        <p>鼠标左键：旋转视角</p>
        <p>鼠标右键：平移视角</p>
        <p>滚轮：缩放</p>
        <p>中键：平移视角</p>
    </div>
    <div class="model-selector">
        <label for="modelSelect">选择模型：</label>
        <select id="modelSelect">
            <option value="house_model.glb">房屋模型</option>
            <option value="house.glb">房屋1</option>
            <option value="house1.glb">房屋2</option>
            <option value="x-12_mech.glb">机械模型</option>
            <option value="downloaded_scene.glb">场景模型</option>
        </select>
    </div>
    <div class="stats" id="stats">
        <div>FPS: <span id="fps">0</span></div>
        <div>模型: <span id="modelName">无</span></div>
    </div>

    <!-- 使用ES6模块方式导入Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let currentModel = null;
        let mixer = null;
        let clock = new THREE.Clock();
        let stats = {
            fps: 0,
            frameCount: 0,
            lastTime: 0
        };

        window.addEventListener('load', function() {
            setTimeout(init, 50);
        });

        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;

            const container = document.getElementById('container');
            container.appendChild(renderer.domElement);

            // 设置OrbitControls
            setupOrbitControls();

            // 设置光照
            setupLighting();

            // 创建地面
            createGround();

            // 加载默认模型
            loadModel('house_model.glb');

            // 设置模型选择器事件
            setupModelSelector();

            // 窗口大小调整事件
            window.addEventListener('resize', onWindowResize);

            // 开始动画循环
            animate();
        }

        function setupOrbitControls() {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // 设置控制参数
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.enablePan = true;
            controls.enableRotate = true;
            
            // 设置缩放限制
            controls.minDistance = 1;
            controls.maxDistance = 50;
            
            // 设置旋转限制
            controls.minPolarAngle = 0;
            controls.maxPolarAngle = Math.PI;
        }

        function setupLighting() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            // 主方向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(15, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.1;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            // 补充光
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-10, 5, -5);
            scene.add(fillLight);

            // 点光源
            const pointLight = new THREE.PointLight(0xffffff, 0.5, 100);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);
        }

        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x888888,
                transparent: true,
                opacity: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function loadModel(modelPath) {
            // 移除当前模型
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            // 显示加载提示
            document.getElementById('loading').style.display = 'block';
            document.getElementById('modelName').textContent = modelPath;

            const loader = new THREE.GLTFLoader();
            loader.load(
                `../assets/models/${modelPath}`,
                function(gltf) {
                    console.log('模型加载成功:', gltf);
                    
                    currentModel = gltf.scene;
                    
                    // 设置模型位置和缩放
                    currentModel.position.set(0, 0, 0);
                    currentModel.scale.setScalar(1);
                    
                    // 启用阴影
                    currentModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // 计算模型边界框，调整相机位置
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 1.5;

                    camera.position.set(cameraZ, cameraZ, cameraZ);
                    camera.lookAt(center);
                    controls.target.copy(center);
                    controls.update();

                    scene.add(currentModel);

                    // 处理动画
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(currentModel);
                        gltf.animations.forEach((clip) => {
                            mixer.clipAction(clip).play();
                        });
                    }

                    // 隐藏加载提示
                    document.getElementById('loading').style.display = 'none';
                },
                function(progress) {
                    console.log('加载进度:', (progress.loaded / progress.total * 100) + '%');
                },
                function(error) {
                    console.error('模型加载失败:', error);
                    document.getElementById('loading').innerHTML = '模型加载失败！';
                }
            );
        }

        function setupModelSelector() {
            const modelSelect = document.getElementById('modelSelect');
            modelSelect.addEventListener('change', function() {
                loadModel(this.value);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateStats() {
            stats.frameCount++;
            const currentTime = performance.now();
            if (currentTime - stats.lastTime >= 1000) {
                stats.fps = Math.round((stats.frameCount * 1000) / (currentTime - stats.lastTime));
                stats.frameCount = 0;
                stats.lastTime = currentTime;
                document.getElementById('fps').textContent = stats.fps;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 更新控制器
            controls.update();

            // 更新动画混合器
            if (mixer) {
                mixer.update(clock.getDelta());
            }

            // 更新统计信息
            updateStats();

            // 渲染场景
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
