<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>模型加载调试页面</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 600px;
            border: 2px solid #333;
            margin: 20px 0;
        }
        .debug-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        .info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #2196f3;
        }
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1976d2;
        }
        .model-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 模型加载调试页面</h1>
    
    <div class="debug-info">
        <h3>📊 调试信息</h3>
        <div id="debugLog"></div>
    </div>
    
    <div class="model-list">
        <button onclick="testModel('house_model.glb')">🏠 房屋模型</button>
        <button onclick="testModel('house.glb')">🏡 房屋1</button>
        <button onclick="testModel('house1.glb')">🏘️ 房屋2</button>
        <button onclick="testModel('x-12_mech.glb')">🤖 机械模型</button>
        <button onclick="testModel('downloaded_scene.glb')">🌍 场景模型</button>
        <button onclick="testPath()">🔍 测试路径</button>
        <button onclick="clearLog()">🗑️ 清空日志</button>
    </div>
    
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let currentModel = null;

        function log(message, type = 'info') {
            const debugLog = document.getElementById('debugLog');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugLog.appendChild(div);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('debugLog').innerHTML = '';
        }

        function testPath() {
            log('🔍 开始测试路径...', 'info');
            
            // 测试相对路径
            const testPaths = [
                '../assets/models/house_model.glb',
                './assets/models/house_model.glb',
                'assets/models/house_model.glb',
                '../homework1/assets/models/house_model.glb'
            ];
            
            testPaths.forEach((path, index) => {
                log(`路径 ${index + 1}: ${path}`, 'info');
                
                // 尝试fetch测试路径
                fetch(path)
                    .then(response => {
                        if (response.ok) {
                            log(`✅ 路径 ${index + 1} 可访问: ${path}`, 'success');
                        } else {
                            log(`❌ 路径 ${index + 1} 不可访问: ${path} (状态: ${response.status})`, 'error');
                        }
                    })
                    .catch(error => {
                        log(`❌ 路径 ${index + 1} 错误: ${path} (${error.message})`, 'error');
                    });
            });
        }

        function init() {
            log('🚀 初始化Three.js场景...', 'info');
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(800, 600);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const container = document.getElementById('container');
            container.appendChild(renderer.domElement);

            // 设置OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 设置光照
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);

            // 创建默认立方体
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            cube.name = 'defaultCube';
            cube.position.set(0, 0, 0);
            scene.add(cube);

            log('✅ Three.js场景初始化完成', 'success');
            log(`Three.js版本: ${THREE.REVISION}`, 'info');
            log(`GLTFLoader可用: ${typeof THREE.GLTFLoader !== 'undefined'}`, 'info');
            log(`OrbitControls可用: ${typeof THREE.OrbitControls !== 'undefined'}`, 'info');

            animate();
        }

        function testModel(modelPath) {
            log(`📦 开始测试模型: ${modelPath}`, 'info');
            
            // 移除当前模型
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            // 移除默认立方体
            const defaultGeometry = scene.getObjectByName('defaultCube');
            if (defaultGeometry) {
                scene.remove(defaultGeometry);
            }

            const loader = new THREE.GLTFLoader();
            const modelUrl = `../assets/models/${modelPath}`;
            
            log(`🌐 请求URL: ${modelUrl}`, 'info');
            
            // 先测试路径是否可访问
            fetch(modelUrl)
                .then(response => {
                    if (response.ok) {
                        log(`✅ 模型文件可访问: ${modelUrl}`, 'success');
                        loadModelWithLoader(loader, modelUrl, modelPath);
                    } else {
                        log(`❌ 模型文件不可访问: ${modelUrl} (状态: ${response.status})`, 'error');
                        // 尝试其他路径
                        tryAlternativePaths(loader, modelPath);
                    }
                })
                .catch(error => {
                    log(`❌ 网络错误: ${error.message}`, 'error');
                    // 尝试其他路径
                    tryAlternativePaths(loader, modelPath);
                });
        }

        function tryAlternativePaths(loader, modelPath) {
            const alternativePaths = [
                `./assets/models/${modelPath}`,
                `assets/models/${modelPath}`,
                `../homework1/assets/models/${modelPath}`
            ];

            log('🔄 尝试其他路径...', 'info');
            
            alternativePaths.forEach((path, index) => {
                log(`尝试路径 ${index + 1}: ${path}`, 'info');
                
                fetch(path)
                    .then(response => {
                        if (response.ok) {
                            log(`✅ 找到可用路径: ${path}`, 'success');
                            loadModelWithLoader(loader, path, modelPath);
                        } else {
                            log(`❌ 路径不可用: ${path} (状态: ${response.status})`, 'error');
                        }
                    })
                    .catch(error => {
                        log(`❌ 路径错误: ${path} (${error.message})`, 'error');
                    });
            });
        }

        function loadModelWithLoader(loader, modelUrl, modelPath) {
            loader.load(
                modelUrl,
                function(gltf) {
                    log(`✅ 模型加载成功: ${modelPath}`, 'success');
                    log(`模型信息: ${gltf.scene.children.length} 个子对象`, 'info');
                    
                    currentModel = gltf.scene;
                    currentModel.position.set(0, 0, 0);
                    currentModel.scale.setScalar(1);
                    
                    // 启用阴影
                    currentModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // 计算边界框
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    log(`模型中心: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`, 'info');
                    log(`模型大小: (${size.x.toFixed(2)}, ${size.y.toFixed(2)}, ${size.z.toFixed(2)})`, 'info');

                    // 调整相机位置
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 1.5;

                    camera.position.set(cameraZ, cameraZ, cameraZ);
                    camera.lookAt(center);
                    controls.target.copy(center);
                    controls.update();

                    scene.add(currentModel);
                    log('🎉 模型已添加到场景', 'success');
                },
                function(progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    log(`📊 加载进度: ${percent}%`, 'info');
                },
                function(error) {
                    log(`❌ 模型加载失败: ${error.message}`, 'error');
                    log(`错误类型: ${error.type}`, 'error');
                    log(`请求URL: ${modelUrl}`, 'error');
                    
                    // 重新添加默认立方体
                    const geometry = new THREE.BoxGeometry(1, 1, 1);
                    const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                    const cube = new THREE.Mesh(geometry, material);
                    cube.name = 'errorCube';
                    cube.position.set(0, 0, 0);
                    scene.add(cube);
                }
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            setTimeout(init, 100);
        });
    </script>
</body>
</html>
