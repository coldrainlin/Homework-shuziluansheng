<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>3D调试版本</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        .debug {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            max-width: 400px;
        }
        .controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <h3>🔧 3D调试版本</h3>
        <p>这个版本用于调试3D显示问题</p>
        <p>应该能看到旋转的彩色立方体</p>
    </div>
    <div class="debug" id="debugLog">
        <div>调试信息将显示在这里...</div>
    </div>
    <div class="controls">
        <div>🖱️ 左键拖拽：旋转</div>
        <div>🖱️ 右键拖拽：平移</div>
        <div>🎯 滚轮：缩放</div>
    </div>

    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let cube;

        function log(message) {
            const debugLog = document.getElementById('debugLog');
            const div = document.createElement('div');
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugLog.appendChild(div);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message);
        }

        function init() {
            log('🚀 开始初始化3D场景...');
            
            // 检查Three.js
            if (typeof THREE === 'undefined') {
                log('❌ Three.js未加载');
                return;
            }
            
            log(`✅ Three.js版本: ${THREE.REVISION}`);
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            log('✅ 场景创建成功');
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);
            log('✅ 相机创建成功');
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            log('✅ 渲染器创建成功');
            
            // 添加到DOM
            const container = document.getElementById('container');
            container.appendChild(renderer.domElement);
            log('✅ 渲染器已添加到DOM');
            
            // 创建几何体
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0, 0);
            scene.add(cube);
            log('✅ 立方体创建并添加到场景');
            
            // 添加光照
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            log('✅ 光照设置完成');
            
            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            scene.add(ground);
            log('✅ 地面创建完成');
            
            // 设置鼠标控制
            setupMouseControls();
            
            // 开始渲染循环
            animate();
            log('✅ 渲染循环已启动');
        }

        function setupMouseControls() {
            let isMouseDown = false;
            let isRightMouseDown = false;
            let mouseX = 0, mouseY = 0;
            
            const container = document.getElementById('container');
            
            container.addEventListener('mousedown', (event) => {
                if (event.button === 0) {
                    isMouseDown = true;
                } else if (event.button === 2) {
                    isRightMouseDown = true;
                }
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            container.addEventListener('mouseup', (event) => {
                if (event.button === 0) {
                    isMouseDown = false;
                } else if (event.button === 2) {
                    isRightMouseDown = false;
                }
            });
            
            container.addEventListener('mousemove', (event) => {
                if (isMouseDown) {
                    const deltaX = event.clientX - mouseX;
                    const deltaY = event.clientY - mouseY;
                    
                    // 旋转相机
                    const spherical = new THREE.Spherical();
                    spherical.setFromVector3(camera.position);
                    spherical.theta -= deltaX * 0.01;
                    spherical.phi += deltaY * 0.01;
                    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                    
                    camera.position.setFromSpherical(spherical);
                    camera.lookAt(0, 0, 0);
                    
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                } else if (isRightMouseDown) {
                    const deltaX = event.clientX - mouseX;
                    const deltaY = event.clientY - mouseY;
                    
                    // 平移相机
                    const right = new THREE.Vector3();
                    right.crossVectors(camera.up, camera.getWorldDirection(new THREE.Vector3())).normalize();
                    const up = camera.up.clone();
                    const moveSpeed = 0.01;
                    
                    camera.position.addScaledVector(right, -deltaX * moveSpeed);
                    camera.position.addScaledVector(up, deltaY * moveSpeed);
                    
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                }
            });
            
            container.addEventListener('wheel', (event) => {
                const scale = event.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(scale);
                event.preventDefault();
            });
            
            container.addEventListener('contextmenu', (event) => {
                event.preventDefault();
            });
            
            log('✅ 鼠标控制设置完成');
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 旋转立方体
            if (cube) {
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
            }
            
            // 渲染场景
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            setTimeout(init, 100);
        });

        // 窗口大小调整
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
