<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>简单测试版本</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 800px;
            height: 600px;
            border: 2px solid #333;
            margin: 20px 0;
        }
        .info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1976d2;
        }
    </style>
</head>
<body>
    <h1>🔧 Three.js 简单测试</h1>
    
    <div class="info">
        <h3>📊 测试信息</h3>
        <div id="testLog"></div>
    </div>
    
    <div>
        <button onclick="testThreeJS()">测试Three.js</button>
        <button onclick="testGLTF()">测试GLTF加载</button>
        <button onclick="testOrbitControls()">测试OrbitControls</button>
        <button onclick="clearLog()">清空日志</button>
    </div>
    
    <div id="container"></div>

    <!-- 使用稳定的CDN -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let testCube = null;

        function log(message, type = 'info') {
            const testLog = document.getElementById('testLog');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            testLog.appendChild(div);
            testLog.scrollTop = testLog.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('testLog').innerHTML = '';
        }

        function testThreeJS() {
            log('🔍 测试Three.js库...');
            
            if (typeof THREE === 'undefined') {
                log('❌ Three.js未加载', 'error');
                return;
            }
            
            log(`✅ Three.js版本: ${THREE.REVISION}`, 'success');
            log(`✅ 场景类可用: ${typeof THREE.Scene !== 'undefined'}`, 'success');
            log(`✅ 相机类可用: ${typeof THREE.PerspectiveCamera !== 'undefined'}`, 'success');
            log(`✅ 渲染器类可用: ${typeof THREE.WebGLRenderer !== 'undefined'}`, 'success');
            
            // 创建简单场景
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                
                camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);
                camera.position.set(5, 5, 5);
                
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(800, 600);
                
                const container = document.getElementById('container');
                container.appendChild(renderer.domElement);
                
                // 创建测试立方体
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                testCube = new THREE.Mesh(geometry, material);
                scene.add(testCube);
                
                // 添加光照
                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(5, 5, 5);
                scene.add(light);
                
                // 开始渲染
                animate();
                
                log('✅ Three.js场景创建成功', 'success');
            } catch (error) {
                log(`❌ Three.js场景创建失败: ${error.message}`, 'error');
            }
        }

        function testGLTF() {
            log('🔍 测试GLTFLoader...');
            
            if (typeof THREE.GLTFLoader === 'undefined') {
                log('❌ GLTFLoader未加载', 'error');
                return;
            }
            
            log('✅ GLTFLoader可用', 'success');
            
            const loader = new THREE.GLTFLoader();
            const modelUrl = '../assets/models/house_model.glb';
            
            log(`🌐 尝试加载: ${modelUrl}`);
            
            loader.load(
                modelUrl,
                function(gltf) {
                    log('✅ GLTF模型加载成功', 'success');
                    log(`模型子对象数量: ${gltf.scene.children.length}`);
                },
                function(progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    log(`📊 加载进度: ${percent}%`);
                },
                function(error) {
                    log(`❌ GLTF加载失败: ${error.message}`, 'error');
                }
            );
        }

        function testOrbitControls() {
            log('🔍 测试OrbitControls...');
            
            if (typeof THREE.OrbitControls === 'undefined') {
                log('❌ OrbitControls未加载', 'error');
                return;
            }
            
            if (!camera || !renderer) {
                log('❌ 请先测试Three.js', 'error');
                return;
            }
            
            try {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                
                log('✅ OrbitControls创建成功', 'success');
                log('✅ 鼠标控制已启用', 'success');
            } catch (error) {
                log(`❌ OrbitControls创建失败: ${error.message}`, 'error');
            }
        }

        function animate() {
            if (!renderer || !scene || !camera) return;
            
            requestAnimationFrame(animate);
            
            // 旋转立方体
            if (testCube) {
                testCube.rotation.x += 0.01;
                testCube.rotation.y += 0.01;
            }
            
            // 更新控制器
            if (controls) {
                controls.update();
            }
            
            renderer.render(scene, camera);
        }

        // 页面加载完成后自动测试
        window.addEventListener('load', function() {
            setTimeout(() => {
                log('🚀 页面加载完成，开始自动测试...');
                testThreeJS();
            }, 100);
        });
    </script>
</body>
</html>
