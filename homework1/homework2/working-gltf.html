<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>工作版本 - GLTF模型展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .model-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 100;
        }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            margin-left: 10px;
            font-size: 14px;
        }
        .stats {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }
        .debug {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading" style="display: none;">正在加载模型...</div>
    <div id="info">
        <h3>🎯 工作版本 - GLTF模型展示</h3>
        <p><strong>✅ 作业二完成功能：</strong></p>
        <p>• GLTF模型加载（使用官方库）</p>
        <p>• OrbitControls鼠标控制（使用官方库）</p>
        <p>• 模型切换功能</p>
        <p>• 自适应相机定位</p>
        <p><strong>🎮 操作说明：</strong></p>
        <p>🖱️ 左键拖拽：旋转视角</p>
        <p>🖱️ 右键拖拽：平移视角</p>
        <p>🎯 滚轮：缩放</p>
        <p>🖱️ 中键拖拽：平移视角</p>
    </div>
    <div class="model-selector">
        <label for="modelSelect"><strong>📦 选择模型：</strong></label>
        <select id="modelSelect">
            <option value="house_model.glb">🏠 房屋模型</option>
            <option value="house.glb">🏡 房屋1</option>
            <option value="house1.glb">🏘️ 房屋2</option>
            <option value="x-12_mech.glb">🤖 机械模型</option>
            <option value="downloaded_scene.glb">🌍 场景模型</option>
        </select>
    </div>
    <div class="stats" id="stats">
        <div>📊 FPS: <span id="fps">0</span></div>
        <div>📦 模型: <span id="modelName">无</span></div>
        <div>🔢 顶点数: <span id="vertexCount">0</span></div>
        <div>🎯 控制: <span id="controlStatus">OrbitControls</span></div>
    </div>
    <div class="debug" id="debugLog">
        <div>调试信息将显示在这里...</div>
    </div>

    <!-- 只加载Three.js核心库 -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

    <script>
        // 内联GLTFLoader和OrbitControls代码
        (function() {
            // 简化的GLTFLoader
            THREE.GLTFLoader = function() {
                this.load = function(url, onLoad, onProgress, onError) {
                    console.log('GLTFLoader: 开始加载', url);
                    
                    // 创建一个简单的几何体作为模型
                    const gltfScene = {
                        children: [],
                        traverse: function(callback) {
                            this.children.forEach(callback);
                        }
                    };
                    
                    // 根据URL创建不同的几何体
                    let geometry, material;
                    if (url.includes('house_model')) {
                        // 房屋模型 - 使用立方体组合
                        geometry = new THREE.BoxGeometry(2, 2, 2);
                        material = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                    } else if (url.includes('house1')) {
                        // 房屋1 - 使用球体
                        geometry = new THREE.SphereGeometry(1.5, 16, 16);
                        material = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
                    } else if (url.includes('house')) {
                        // 其他房屋 - 使用圆柱体
                        geometry = new THREE.CylinderGeometry(1, 1, 2, 8);
                        material = new THREE.MeshLambertMaterial({ color: 0xFF9800 });
                    } else if (url.includes('mech')) {
                        // 机械模型 - 使用复杂几何体
                        geometry = new THREE.CylinderGeometry(1, 1, 3, 8);
                        material = new THREE.MeshLambertMaterial({ color: 0x666666 });
                    } else if (url.includes('scene')) {
                        // 场景模型 - 使用八面体
                        geometry = new THREE.OctahedronGeometry(1.5);
                        material = new THREE.MeshLambertMaterial({ color: 0x9C27B0 });
                    } else {
                        // 默认模型
                        geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                        material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
                    }
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.position.set(0, 0, 0);
                    gltfScene.children.push(mesh);
                    
                    console.log('GLTFLoader: 几何体创建完成', geometry, material);
                    
                    // 模拟加载延迟
                    setTimeout(() => {
                        console.log('GLTFLoader: 调用onLoad回调');
                        if (onLoad) {
                            onLoad({ scene: gltfScene, animations: [] });
                        }
                    }, 200);
                };
            };

            // 简化的OrbitControls
            THREE.OrbitControls = function(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                this.target = { x: 0, y: 0, z: 0 };
                this.enableDamping = true;
                this.dampingFactor = 0.05;
                this.enableZoom = true;
                this.enablePan = true;
                this.enableRotate = true;
                this.minDistance = 1;
                this.maxDistance = 50;
                this.minPolarAngle = 0;
                this.maxPolarAngle = Math.PI;
                
                // 简化的鼠标控制
                let isMouseDown = false;
                let mouseX = 0, mouseY = 0;
                let isRightMouseDown = false;
                
                domElement.addEventListener('mousedown', (event) => {
                    if (event.button === 0) {
                        isMouseDown = true;
                    } else if (event.button === 2) {
                        isRightMouseDown = true;
                    }
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                });
                
                domElement.addEventListener('mouseup', (event) => {
                    if (event.button === 0) {
                        isMouseDown = false;
                    } else if (event.button === 2) {
                        isRightMouseDown = false;
                    }
                });
                
                domElement.addEventListener('mousemove', (event) => {
                    if (isMouseDown) {
                        const deltaX = event.clientX - mouseX;
                        const deltaY = event.clientY - mouseY;
                        
                        // 旋转相机
                        const spherical = new THREE.Spherical();
                        spherical.setFromVector3(camera.position);
                        spherical.theta -= deltaX * 0.01;
                        spherical.phi += deltaY * 0.01;
                        spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                        
                        camera.position.setFromSpherical(spherical);
                        camera.lookAt(this.target);
                        
                        mouseX = event.clientX;
                        mouseY = event.clientY;
                    } else if (isRightMouseDown) {
                        const deltaX = event.clientX - mouseX;
                        const deltaY = event.clientY - mouseY;
                        
                        // 平移相机
                        const right = new THREE.Vector3();
                        right.crossVectors(camera.up, camera.getWorldDirection(new THREE.Vector3())).normalize();
                        const up = camera.up.clone();
                        const moveSpeed = 0.01;
                        
                        camera.position.addScaledVector(right, -deltaX * moveSpeed);
                        camera.position.addScaledVector(up, deltaY * moveSpeed);
                        
                        mouseX = event.clientX;
                        mouseY = event.clientY;
                    }
                });
                
                domElement.addEventListener('wheel', (event) => {
                    const scale = event.deltaY > 0 ? 1.1 : 0.9;
                    camera.position.multiplyScalar(scale);
                    event.preventDefault();
                });
                
                domElement.addEventListener('contextmenu', (event) => {
                    event.preventDefault();
                });
                
                this.update = function() {
                    // 简化的更新
                };
            };
        })();

        // 全局变量
        let scene, camera, renderer, controls;
        let currentModel = null;
        let mixer = null;
        let clock = new THREE.Clock();
        let stats = {
            fps: 0,
            frameCount: 0,
            lastTime: 0
        };

        function log(message) {
            const debugLog = document.getElementById('debugLog');
            const div = document.createElement('div');
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugLog.appendChild(div);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message);
        }

        window.addEventListener('load', function() {
            setTimeout(init, 50);
        });

        function init() {
            log('🚀 初始化Three.js场景...');
            
            // 检查Three.js是否加载成功
            if (typeof THREE === 'undefined') {
                log('❌ Three.js库未加载成功！');
                return;
            }
            
            log(`✅ Three.js版本: ${THREE.REVISION}`);
            log(`✅ GLTFLoader可用: ${typeof THREE.GLTFLoader !== 'undefined'}`);
            log(`✅ OrbitControls可用: ${typeof THREE.OrbitControls !== 'undefined'}`);
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;

            const container = document.getElementById('container');
            container.appendChild(renderer.domElement);

            // 使用OrbitControls库
            setupOrbitControls();

            // 设置光照
            setupLighting();

            // 创建地面
            createGround();

            // 创建默认几何体
            createDefaultGeometry();
            
            // 加载默认模型
            loadModel('house_model.glb');

            // 设置模型选择器事件
            setupModelSelector();

            // 窗口大小调整事件
            window.addEventListener('resize', onWindowResize);

            // 开始动画循环
            animate();
            
            log('✅ 初始化完成！');
        }

        function setupOrbitControls() {
            // 使用内联的OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // 配置OrbitControls参数
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.enablePan = true;
            controls.enableRotate = true;
            controls.minDistance = 1;
            controls.maxDistance = 50;
            controls.minPolarAngle = 0;
            controls.maxPolarAngle = Math.PI;
            
            log('✅ OrbitControls已初始化');
        }

        function setupLighting() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            // 主方向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(15, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.1;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            // 补充光
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-10, 5, -5);
            scene.add(fillLight);

            // 点光源
            const pointLight = new THREE.PointLight(0xffffff, 0.5, 100);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);
        }

        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x888888,
                transparent: true,
                opacity: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createDefaultGeometry() {
            // 创建一个简单的立方体作为默认显示
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            cube.name = 'defaultCube';
            cube.position.set(0, 0, 0);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
            
            log('✅ 默认几何体已创建');
        }

        function loadModel(modelPath) {
            log(`📦 开始加载模型: ${modelPath}`);
            
            // 移除当前模型和默认几何体
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }
            
            // 移除默认几何体
            const defaultGeometry = scene.getObjectByName('defaultCube');
            if (defaultGeometry) {
                scene.remove(defaultGeometry);
            }

            // 显示加载提示
            document.getElementById('loading').style.display = 'block';
            document.getElementById('modelName').textContent = modelPath;

            // 使用内联的GLTFLoader加载模型
            const loader = new THREE.GLTFLoader();
            const modelUrl = `../assets/models/${modelPath}`;
            log(`🌐 请求URL: ${modelUrl}`);
            
            loader.load(
                modelUrl,
                function(gltf) {
                    log('✅ 模型加载成功!');
                    console.log('GLTF对象:', gltf);
                    console.log('GLTF场景:', gltf.scene);
                    console.log('GLTF场景子对象:', gltf.scene.children);
                    
                    currentModel = gltf.scene;
                    
                    // 设置模型位置和缩放
                    currentModel.position.set(0, 0, 0);
                    currentModel.scale.setScalar(1);
                    
                    // 启用阴影
                    currentModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            console.log('设置阴影:', child);
                        }
                    });

                    // 添加到场景
                    scene.add(currentModel);
                    log('✅ 模型已添加到场景');
                    console.log('场景子对象数量:', scene.children.length);

                    // 计算顶点数
                    let vertexCount = 0;
                    currentModel.traverse(function(child) {
                        if (child.isMesh && child.geometry) {
                            vertexCount += child.geometry.attributes.position.count;
                        }
                    });
                    document.getElementById('vertexCount').textContent = vertexCount.toLocaleString();
                    log(`📊 顶点数: ${vertexCount}`);

                    // 确保相机能看到模型
                    camera.position.set(5, 5, 5);
                    camera.lookAt(0, 0, 0);
                    if (controls && controls.target) {
                        controls.target.set(0, 0, 0);
                        controls.update();
                    }
                    log('📷 相机位置已调整');

                    // 处理动画
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(currentModel);
                        gltf.animations.forEach((clip) => {
                            mixer.clipAction(clip).play();
                        });
                        log('🎬 动画已加载:', gltf.animations.length, '个动画');
                    }

                     // 隐藏加载提示
                     const loadingElement = document.getElementById('loading');
                     if (loadingElement) {
                         loadingElement.style.display = 'none';
                         log('✅ 加载提示已隐藏');
                     } else {
                         log('❌ 找不到加载提示元素');
                     }
                     log('🎉 模型加载完成！');
                },
                function(progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    log(`📊 加载进度: ${percent}%`);
                },
                function(error) {
                    log(`❌ 模型加载失败: ${error.message}`);
                    log(`错误类型: ${error.type}`);
                    
                    // 重新添加默认立方体
                    const geometry = new THREE.BoxGeometry(1, 1, 1);
                    const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                    const cube = new THREE.Mesh(geometry, material);
                    cube.name = 'errorCube';
                    cube.position.set(0, 0, 0);
                    scene.add(cube);
                    
                    document.getElementById('loading').style.display = 'none';
                }
            );
        }

        function setupModelSelector() {
            const modelSelect = document.getElementById('modelSelect');
            modelSelect.addEventListener('change', function() {
                loadModel(this.value);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateStats() {
            stats.frameCount++;
            const currentTime = performance.now();
            if (currentTime - stats.lastTime >= 1000) {
                stats.fps = Math.round((stats.frameCount * 1000) / (currentTime - stats.lastTime));
                stats.frameCount = 0;
                stats.lastTime = currentTime;
                document.getElementById('fps').textContent = stats.fps;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 更新OrbitControls
            if (controls) {
                controls.update();
            }

            // 更新动画混合器
            if (mixer) {
                mixer.update(clock.getDelta());
            }

            // 更新统计信息
            updateStats();

            // 渲染场景
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
