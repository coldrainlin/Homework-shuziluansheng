<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Three.js GLTF模型展示 - 作业二 (最终版)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            max-width: 320px;
            backdrop-filter: blur(10px);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .model-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            margin-left: 10px;
            font-size: 14px;
        }
        .stats {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .controls-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            max-width: 200px;
            backdrop-filter: blur(10px);
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading" style="display: none;">
        <div>正在加载模型...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
    <div id="info">
        <h3>🎯 Three.js GLTF模型展示</h3>
        <p><strong>✅ 作业二完成功能：</strong></p>
        <p>• GLTF模型加载（使用官方库）</p>
        <p>• OrbitControls鼠标控制（使用官方库）</p>
        <p>• 模型切换功能</p>
        <p>• 动画支持</p>
        <p>• 自适应相机定位</p>
        <p><strong>🎮 操作说明：</strong></p>
        <p>🖱️ 左键拖拽：旋转视角</p>
        <p>🖱️ 右键拖拽：平移视角</p>
        <p>🎯 滚轮：缩放</p>
        <p>🖱️ 中键拖拽：平移视角</p>
    </div>
    <div class="model-selector">
        <label for="modelSelect"><strong>📦 选择模型：</strong></label>
        <select id="modelSelect">
            <option value="house_model.glb">🏠 房屋模型</option>
            <option value="house.glb">🏡 房屋1</option>
            <option value="house1.glb">🏘️ 房屋2</option>
            <option value="x-12_mech.glb">🤖 机械模型</option>
            <option value="downloaded_scene.glb">🌍 场景模型</option>
        </select>
    </div>
    <div class="stats" id="stats">
        <div>📊 FPS: <span id="fps">0</span></div>
        <div>📦 模型: <span id="modelName">无</span></div>
        <div>🔢 顶点数: <span id="vertexCount">0</span></div>
        <div>🎯 控制: <span id="controlStatus">OrbitControls</span></div>
    </div>
    <div class="controls-info">
        <strong>🎮 OrbitControls 操作：</strong><br>
        左键拖拽：旋转<br>
        右键拖拽：平移<br>
        滚轮：缩放<br>
        中键拖拽：平移
    </div>

    <!-- 使用稳定的CDN链接 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let currentModel = null;
        let mixer = null;
        let clock = new THREE.Clock();
        let stats = {
            fps: 0,
            frameCount: 0,
            lastTime: 0
        };

        window.addEventListener('load', function() {
            setTimeout(init, 50);
        });

        function init() {
            console.log('🚀 初始化Three.js场景...');
            console.log('Three.js版本:', THREE.REVISION);
            console.log('OrbitControls可用:', typeof THREE.OrbitControls !== 'undefined');
            console.log('GLTFLoader可用:', typeof THREE.GLTFLoader !== 'undefined');

            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;

            const container = document.getElementById('container');
            container.appendChild(renderer.domElement);

            // 使用OrbitControls库
            setupOrbitControls();

            // 设置光照
            setupLighting();

            // 创建地面
            createGround();

            // 创建默认几何体作为备用
            createDefaultGeometry();
            
            // 加载默认模型
            loadModel('house_model.glb');

            // 设置模型选择器事件
            setupModelSelector();

            // 窗口大小调整事件
            window.addEventListener('resize', onWindowResize);

            // 开始动画循环
            animate();
            
            console.log('✅ 初始化完成！');
        }

        function setupOrbitControls() {
            // 使用Three.js官方OrbitControls库
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // 配置OrbitControls参数
            controls.enableDamping = true;        // 启用阻尼效果
            controls.dampingFactor = 0.05;        // 阻尼系数
            controls.enableZoom = true;           // 启用缩放
            controls.enablePan = true;            // 启用平移
            controls.enableRotate = true;         // 启用旋转
            controls.screenSpacePanning = false;  // 禁用屏幕空间平移
            
            // 设置距离限制
            controls.minDistance = 1;
            controls.maxDistance = 50;
            
            // 设置旋转限制
            controls.minPolarAngle = 0;           // 最小仰角
            controls.maxPolarAngle = Math.PI;     // 最大仰角
            
            console.log('✅ OrbitControls已初始化');
        }

        function setupLighting() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            // 主方向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(15, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.1;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            // 补充光
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-10, 5, -5);
            scene.add(fillLight);

            // 点光源
            const pointLight = new THREE.PointLight(0xffffff, 0.5, 100);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);
        }

        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x888888,
                transparent: true,
                opacity: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createDefaultGeometry() {
            // 创建一个简单的立方体作为默认显示
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            cube.name = 'defaultCube';
            cube.position.set(0, 0, 0);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
            
            console.log('✅ 默认几何体已创建');
        }

        function loadModel(modelPath) {
            console.log('📦 开始加载模型:', modelPath);
            
            // 移除当前模型和默认几何体
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }
            
            // 移除默认几何体
            const defaultGeometry = scene.getObjectByName('defaultCube');
            if (defaultGeometry) {
                scene.remove(defaultGeometry);
            }

            // 显示加载提示
            document.getElementById('loading').style.display = 'block';
            document.getElementById('modelName').textContent = modelPath;

            // 使用GLTFLoader库加载模型
            const loader = new THREE.GLTFLoader();
            const modelUrl = `../assets/models/${modelPath}`;
            console.log('🌐 请求URL:', modelUrl);
            
            // 先测试文件是否存在
            fetch(modelUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    console.log('✅ 模型文件可访问');
                    return loadModelWithLoader(loader, modelUrl, modelPath);
                })
                .catch(error => {
                    console.error('❌ 模型文件不可访问:', error);
                    // 尝试其他路径
                    tryAlternativePaths(loader, modelPath);
                });
        }

        function tryAlternativePaths(loader, modelPath) {
            const alternativePaths = [
                `./assets/models/${modelPath}`,
                `assets/models/${modelPath}`,
                `../homework1/assets/models/${modelPath}`
            ];

            console.log('🔄 尝试其他路径...');
            
            let pathIndex = 0;
            function tryNextPath() {
                if (pathIndex >= alternativePaths.length) {
                    console.error('❌ 所有路径都不可用');
                    showError('所有路径都不可用，请检查模型文件');
                    return;
                }

                const path = alternativePaths[pathIndex];
                console.log(`尝试路径 ${pathIndex + 1}: ${path}`);
                
                fetch(path)
                    .then(response => {
                        if (response.ok) {
                            console.log(`✅ 找到可用路径: ${path}`);
                            loadModelWithLoader(loader, path, modelPath);
                        } else {
                            console.log(`❌ 路径不可用: ${path} (状态: ${response.status})`);
                            pathIndex++;
                            tryNextPath();
                        }
                    })
                    .catch(error => {
                        console.log(`❌ 路径错误: ${path} (${error.message})`);
                        pathIndex++;
                        tryNextPath();
                    });
            }
            
            tryNextPath();
        }

        function loadModelWithLoader(loader, modelUrl, modelPath) {
            loader.load(
                modelUrl,
                function(gltf) {
                    console.log('✅ 模型加载成功:', gltf);
                    
                    currentModel = gltf.scene;
                    
                    // 设置模型位置和缩放
                    currentModel.position.set(0, 0, 0);
                    currentModel.scale.setScalar(1);
                    
                    // 启用阴影
                    currentModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // 计算模型边界框，调整相机位置
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 1.5;

                    camera.position.set(cameraZ, cameraZ, cameraZ);
                    camera.lookAt(center);
                    controls.target.copy(center);
                    controls.update();

                    scene.add(currentModel);

                    // 处理动画
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(currentModel);
                        gltf.animations.forEach((clip) => {
                            mixer.clipAction(clip).play();
                        });
                        console.log('🎬 动画已加载:', gltf.animations.length, '个动画');
                    }

                    // 计算顶点数
                    let vertexCount = 0;
                    currentModel.traverse(function(child) {
                        if (child.isMesh && child.geometry) {
                            vertexCount += child.geometry.attributes.position.count;
                        }
                    });
                    document.getElementById('vertexCount').textContent = vertexCount.toLocaleString();

                    // 隐藏加载提示
                    document.getElementById('loading').style.display = 'none';
                    console.log('🎉 模型加载完成！');
                },
                function(progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    console.log('📊 加载进度:', percent + '%');
                    document.getElementById('loading').innerHTML = `正在加载模型... ${percent}%<div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>`;
                },
                function(error) {
                    console.error('❌ 模型加载失败:', error);
                    console.error('错误详情:', error.message);
                    console.error('请求的URL:', modelUrl);
                    showError(`模型加载失败: ${error.message}`);
                }
            );
        }

        function showError(message) {
            document.getElementById('loading').innerHTML = `❌ ${message}`;
            
            // 重新添加默认立方体
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const cube = new THREE.Mesh(geometry, material);
            cube.name = 'errorCube';
            cube.position.set(0, 0, 0);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
            
            // 更新统计信息
            document.getElementById('vertexCount').textContent = '8';
        }

        function setupModelSelector() {
            const modelSelect = document.getElementById('modelSelect');
            modelSelect.addEventListener('change', function() {
                loadModel(this.value);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateStats() {
            stats.frameCount++;
            const currentTime = performance.now();
            if (currentTime - stats.lastTime >= 1000) {
                stats.fps = Math.round((stats.frameCount * 1000) / (currentTime - stats.lastTime));
                stats.frameCount = 0;
                stats.lastTime = currentTime;
                document.getElementById('fps').textContent = stats.fps;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 更新OrbitControls（这是关键！）
            controls.update();

            // 更新动画混合器
            if (mixer) {
                mixer.update(clock.getDelta());
            }

            // 更新统计信息
            updateStats();

            // 渲染场景
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
