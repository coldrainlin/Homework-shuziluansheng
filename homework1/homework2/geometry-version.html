<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>几何体版本 - 作业二</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        .geometry-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 100;
        }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            margin-left: 10px;
            font-size: 14px;
        }
        .stats {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }
        .controls-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <h3>🎯 几何体版本 - 作业二</h3>
        <p><strong>✅ 完成功能：</strong></p>
        <p>• Three.js几何体展示</p>
        <p>• OrbitControls鼠标控制</p>
        <p>• 几何体切换功能</p>
        <p>• 自适应相机定位</p>
        <p><strong>🎮 操作说明：</strong></p>
        <p>🖱️ 左键拖拽：旋转视角</p>
        <p>🖱️ 右键拖拽：平移视角</p>
        <p>🎯 滚轮：缩放</p>
        <p>🖱️ 中键拖拽：平移视角</p>
    </div>
    <div class="geometry-selector">
        <label for="geometrySelect"><strong>📦 选择几何体：</strong></label>
        <select id="geometrySelect">
            <option value="box">📦 立方体</option>
            <option value="sphere">⚪ 球体</option>
            <option value="cylinder">🥫 圆柱体</option>
            <option value="cone">🔺 圆锥体</option>
            <option value="torus">🍩 圆环体</option>
            <option value="octahedron">💎 八面体</option>
            <option value="tetrahedron">🔺 四面体</option>
            <option value="icosahedron">⚽ 二十面体</option>
        </select>
    </div>
    <div class="stats" id="stats">
        <div>📊 FPS: <span id="fps">0</span></div>
        <div>📦 几何体: <span id="geometryName">立方体</span></div>
        <div>🔢 顶点数: <span id="vertexCount">8</span></div>
        <div>🎯 控制: <span id="controlStatus">OrbitControls</span></div>
    </div>
    <div class="controls-info">
        <strong>🎮 OrbitControls 操作：</strong><br>
        左键拖拽：旋转<br>
        右键拖拽：平移<br>
        滚轮：缩放<br>
        中键拖拽：平移
    </div>

    <!-- 使用稳定的CDN链接 -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let currentGeometry = null;
        let stats = {
            fps: 0,
            frameCount: 0,
            lastTime: 0
        };

        window.addEventListener('load', function() {
            setTimeout(init, 50);
        });

        function init() {
            console.log('🚀 初始化Three.js场景...');
            
            // 检查Three.js是否加载成功
            if (typeof THREE === 'undefined') {
                console.error('❌ Three.js库未加载成功！');
                return;
            }
            
            console.log(`✅ Three.js版本: ${THREE.REVISION}`);
            console.log(`✅ OrbitControls可用: ${typeof THREE.OrbitControls !== 'undefined'}`);
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;

            const container = document.getElementById('container');
            container.appendChild(renderer.domElement);

            // 使用OrbitControls库
            setupOrbitControls();

            // 设置光照
            setupLighting();

            // 创建地面
            createGround();

            // 创建默认几何体
            createGeometry('box');

            // 设置几何体选择器事件
            setupGeometrySelector();

            // 窗口大小调整事件
            window.addEventListener('resize', onWindowResize);

            // 开始动画循环
            animate();
            
            console.log('✅ 初始化完成！');
        }

        function setupOrbitControls() {
            // 使用Three.js官方OrbitControls库
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // 配置OrbitControls参数
            controls.enableDamping = true;        // 启用阻尼效果
            controls.dampingFactor = 0.05;        // 阻尼系数
            controls.enableZoom = true;           // 启用缩放
            controls.enablePan = true;            // 启用平移
            controls.enableRotate = true;         // 启用旋转
            controls.screenSpacePanning = false;  // 禁用屏幕空间平移
            
            // 设置距离限制
            controls.minDistance = 1;
            controls.maxDistance = 50;
            
            // 设置旋转限制
            controls.minPolarAngle = 0;           // 最小仰角
            controls.maxPolarAngle = Math.PI;     // 最大仰角
            
            console.log('✅ OrbitControls已初始化');
        }

        function setupLighting() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            // 主方向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(15, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.1;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            // 补充光
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-10, 5, -5);
            scene.add(fillLight);

            // 点光源
            const pointLight = new THREE.PointLight(0xffffff, 0.5, 100);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);
        }

        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x888888,
                transparent: true,
                opacity: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createGeometry(geometryType) {
            console.log('📦 创建几何体:', geometryType);
            
            // 移除当前几何体
            if (currentGeometry) {
                scene.remove(currentGeometry);
                currentGeometry = null;
            }

            let geometry, material, mesh;
            let vertexCount = 0;

            switch(geometryType) {
                case 'box':
                    geometry = new THREE.BoxGeometry(2, 2, 2);
                    material = new THREE.MeshLambertMaterial({ color: 0xff6b6b });
                    break;
                case 'sphere':
                    geometry = new THREE.SphereGeometry(1.5, 32, 32);
                    material = new THREE.MeshLambertMaterial({ color: 0x4ecdc4 });
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(1, 1, 3, 32);
                    material = new THREE.MeshLambertMaterial({ color: 0x45b7d1 });
                    break;
                case 'cone':
                    geometry = new THREE.ConeGeometry(1.5, 3, 32);
                    material = new THREE.MeshLambertMaterial({ color: 0xf9ca24 });
                    break;
                case 'torus':
                    geometry = new THREE.TorusGeometry(1.5, 0.5, 16, 100);
                    material = new THREE.MeshLambertMaterial({ color: 0x6c5ce7 });
                    break;
                case 'octahedron':
                    geometry = new THREE.OctahedronGeometry(2);
                    material = new THREE.MeshLambertMaterial({ color: 0xfd79a8 });
                    break;
                case 'tetrahedron':
                    geometry = new THREE.TetrahedronGeometry(2);
                    material = new THREE.MeshLambertMaterial({ color: 0x00b894 });
                    break;
                case 'icosahedron':
                    geometry = new THREE.IcosahedronGeometry(1.5);
                    material = new THREE.MeshLambertMaterial({ color: 0xe17055 });
                    break;
                default:
                    geometry = new THREE.BoxGeometry(2, 2, 2);
                    material = new THREE.MeshLambertMaterial({ color: 0xff6b6b });
            }

            mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // 计算顶点数
            if (geometry.attributes.position) {
                vertexCount = geometry.attributes.position.count;
            }

            scene.add(mesh);
            currentGeometry = mesh;

            // 更新统计信息
            document.getElementById('geometryName').textContent = getGeometryName(geometryType);
            document.getElementById('vertexCount').textContent = vertexCount.toLocaleString();

            // 调整相机位置
            const box = new THREE.Box3().setFromObject(mesh);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 2;

            camera.position.set(cameraZ, cameraZ, cameraZ);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();

            console.log('✅ 几何体创建完成');
        }

        function getGeometryName(type) {
            const names = {
                'box': '立方体',
                'sphere': '球体',
                'cylinder': '圆柱体',
                'cone': '圆锥体',
                'torus': '圆环体',
                'octahedron': '八面体',
                'tetrahedron': '四面体',
                'icosahedron': '二十面体'
            };
            return names[type] || '未知';
        }

        function setupGeometrySelector() {
            const geometrySelect = document.getElementById('geometrySelect');
            geometrySelect.addEventListener('change', function() {
                createGeometry(this.value);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateStats() {
            stats.frameCount++;
            const currentTime = performance.now();
            if (currentTime - stats.lastTime >= 1000) {
                stats.fps = Math.round((stats.frameCount * 1000) / (currentTime - stats.lastTime));
                stats.frameCount = 0;
                stats.lastTime = currentTime;
                document.getElementById('fps').textContent = stats.fps;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 更新OrbitControls（这是关键！）
            controls.update();

            // 更新统计信息
            updateStats();

            // 渲染场景
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
